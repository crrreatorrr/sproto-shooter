name: reward-ui
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Validate actual dormant UI, canonical Game lifecycle and ordinary controls
        run: npx vitest run tests/hub/reward-presentation.test.js tests/hub/reward-ui-browser.test.js tests/server/client-command-parity.test.js --no-file-parallelism
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reward-ui-evidence
          path: ci-artifacts/reward-ui
          if-no-files-found: warn
