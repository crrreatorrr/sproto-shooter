name: reward-ui
on:
  pull_request:
    paths:
      - src/hub/campaignRewards/**
      - src/hub/link.js
      - src/game/Game.js
      - src/ui/ui.js
      - src/styles/game.css
      - tests/hub/reward-*.test.js
      - .github/workflows/reward-ui.yml
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate actual dormant UI, canonical Game lifecycle and ordinary controls
        run: npx vitest run tests/hub/reward-presentation.test.js tests/hub/reward-ui-browser.test.js tests/server/client-command-parity.test.js --no-file-parallelism
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reward-ui-evidence
          path: ci-artifacts/reward-ui
          if-no-files-found: warn
