name: campaign-transport
on:
  pull_request:
    paths:
      - src/hub/campaignRewards/**
      - tests/hub/campaign-*
      - docs/shooter-campaign-api.md
      - .github/workflows/campaign-transport.yml
permissions:
  contents: read
jobs:
  transport:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Validate inactive generic SDK adapter, controller faults and actual browser input/network
        run: npx vitest run tests/hub/campaign-transport.test.js tests/hub/campaign-controller.test.js tests/hub/campaign-lifecycle.test.js tests/hub/campaign-network-browser.test.js tests/hub/reward-recorder.test.js --no-file-parallelism
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: campaign-transport-evidence
          path: ci-artifacts/campaign-transport
          if-no-files-found: warn
