name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: test, build, budgets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: npm ci
        run: npm ci

      - name: lint
        run: npm run lint

      - name: typecheck
        run: npm run typecheck

      - name: playwright chromium
        run: npx playwright install --with-deps chromium

      - name: test
        # Keep timing-sensitive Goja replays free of browser test CPU contention.
        run: npm test -- --no-file-parallelism

      - name: build
        run: npm run build

      - name: asset manifest
        run: npm run assets:check

      - name: budgets
        run: npm run budgets

      - name: load profile smoke
        run: npm run profile:check
        env:
          LOAD_PROFILE_OUT: ci-artifacts/load-profile.json

      # Live Nakama is not started here. Set the repository variable
      # SHOOTER_E2E_NAKAMA=true only on a runner that already has the local stack.
      - name: nakama e2e (opt-in)
        if: vars.SHOOTER_E2E_NAKAMA == 'true'
        run: |
          node tests/e2e/shooter-hub.spec.js
          node tests/e2e/shooter-online.spec.js
          node tests/e2e/shooter-wagers.spec.js
        env:
          SHOOTER_E2E_NAKAMA: "1"

      - name: upload load profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-profile
          path: |
            ci-artifacts/load-profile.json
            tests/fixtures/load-profile.json
            tests/fixtures/screenshots/
          if-no-files-found: warn
