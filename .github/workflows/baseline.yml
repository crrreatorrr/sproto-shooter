name: Baseline capture
on:
  pull_request:
    paths:
      - '.github/workflows/baseline.yml'
      - 'scripts/*baseline*.mjs'
      - 'tests/baseline.test.js'
      - 'docs/PERF_BASELINE.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: baseline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/capture-baseline.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sproto-b-m0-baseline
          path: docs/baseline/
          if-no-files-found: warn
